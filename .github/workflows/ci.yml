name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate project files
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s LICENSE
          python - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path("metadata.json")
          if metadata_path.exists():
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              required = ("uuid", "name", "description", "shell-version")
              missing = [key for key in required if key not in metadata]
              if missing:
                  raise SystemExit(f"metadata.json is missing: {', '.join(missing)}")
              if metadata["uuid"] != "gestura@sakibshahariar.github.io":
                  raise SystemExit("metadata.json UUID does not match Gestura's UUID")
              if not isinstance(metadata["shell-version"], list) or not metadata["shell-version"]:
                  raise SystemExit("metadata.json shell-version must be a non-empty list")
              if metadata.get("settings-schema") != "org.gnome.shell.extensions.gestura":
                  raise SystemExit("metadata.json settings-schema does not match Gestura's schema")
          print("Repository documentation and metadata are valid.")
          PY

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Benchmark gesture recognizer
        run: npm run benchmark

      - name: Build extension bundle
        run: |
          python3 scripts/package.py gestura@sakibshahariar.github.io.shell-extension.zip
          python3 - <<'PY'
          import zipfile

          name = "gestura@sakibshahariar.github.io.shell-extension.zip"
          expected = {
              "metadata.json",
              "extension.js",
              "prefs.js",
              "gestureRecognizer.js",
              "windowActions.js",
              "windowHistory.js",
              "windowTracker.js",
              "schemas/org.gnome.shell.extensions.gestura.gschema.xml",
              "schemas/gschemas.compiled",
          }
          with zipfile.ZipFile(name) as bundle:
              actual = set(bundle.namelist())
          missing = expected - actual
          if missing:
              raise SystemExit(f"bundle is missing: {', '.join(sorted(missing))}")
          forbidden = {p for p in actual if p.startswith(("tests/", "docs/", "scripts/", ".github/"))}
          forbidden |= actual & {"package.json", "AGENTS.md", "LICENSE", "README.md"}
          if forbidden:
              raise SystemExit(f"bundle contains development-only files: {', '.join(sorted(forbidden))}")
          print("Extension bundle is valid.")
          PY

      - name: Check patch whitespace
        run: git diff --check
